name: Build & Release

# 触发方式：
#  1) 推送形如 v8.8.8 的 tag  → 自动构建并创建 GitHub Release，附上 zip 产物
#  2) 在 Actions 页面手动点 "Run workflow"（workflow_dispatch）→ 只构建、上传 artifact
#
# Release 附件（一律用纯 ASCII 名，规避 GitHub API 对非 ASCII 文件名的清洗）：
#   NewShell-8.8.8-windows-x86_64.exe   （裸 exe，双击即运行，无需解压）
#   NewShell-8.8.8-macos-arm64.zip      （内含 NewShell.app）
#
# 打包策略的由来（重要）：
#  - Windows：exe 是单个自包含文件，【不打 zip】，直接以 ASCII 名挂到 Release。
#    原因有二：① Release 附件名里的非 ASCII 字符（如「新の世界」）会被 GitHub API
#    清洗，附件退化成 default.exe / 丢扩展名而无法运行——历史上就栽在这；② 若裹进
#    zip，很多用户不解压、直接在资源管理器 zip 预览里双击 exe，GUI 程序（见
#    src/main.rs 的 windows_subsystem="windows"）从临时目录启动会静默失败。裸 exe
#    两个坑都不沾。运行库依赖已由 .cargo/config.toml 的 +crt-static 静态消除。
#  - macOS：.app 是【目录】(bundle)，Release 不能传目录，必须打包。用 ditto 打成
#    ASCII 名 zip（保留 .app 的符号链接、权限与 ad-hoc 签名）——这是 ad-hoc 分发的
#    标准做法。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release / 上传附件需要写权限

jobs:
  # ------------------------------------------------------------------
  # Windows：x86_64 .exe（自包含单文件，静态 CRT）→ 裸 exe 直传，不打 zip
  # ------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Determine version
        id: ver
        shell: bash
        run: echo "v=$(grep -m1 '^version' Cargo.toml | cut -d'\"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Prepare distribution artifacts
        shell: bash
        run: |
          set -e
          mkdir -p dist
          # 构建产物改名为带版本的 ASCII 名（避免 GitHub API 清洗非 ASCII）
          cp target/x86_64-pc-windows-msvc/release/newshell.exe "dist/NewShell-${{ steps.ver.outputs.v }}-windows-x86_64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*.exe

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe

  # ------------------------------------------------------------------
  # macOS Apple Silicon：aarch64 .app → 打进 zip（ditto 保留 ad-hoc 签名）
  # macos-14 runner 本身就是 arm64（M1 系列），原生编译即得 M1 产物
  # ------------------------------------------------------------------
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, Apple Silicon)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --target aarch64-apple-darwin

      - name: Determine version
        id: ver
        run: echo "v=$(grep -m1 '^version' Cargo.toml | cut -d'\"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Generate .icns from icon@512.png
        run: |
          set -e
          ICONSET=newshell.iconset
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s      assets/icon@512.png --out "$ICONSET/icon_${s}x${s}.png"
            sips -z $((s*2)) $((s*2)) assets/icon@512.png --out "$ICONSET/icon_${s}x${s}@2x.png"
          done
          iconutil -c icns "$ICONSET" -o newshell.icns

      - name: Assemble .app bundle
        run: |
          set -e
          APP="NewShell.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          # 二进制（Info.plist 里 CFBundleExecutable 指向 newshell）
          cp target/aarch64-apple-darwin/release/newshell "$APP/Contents/MacOS/newshell"
          chmod +x "$APP/Contents/MacOS/newshell"
          # 图标
          cp newshell.icns "$APP/Contents/Resources/newshell.icns"
          # Info.plist（替换 __VERSION__ 占位符）
          sed "s/__VERSION__/${{ steps.ver.outputs.v }}/g" assets/Info.plist > "$APP/Contents/Info.plist"

      - name: Ad-hoc codesign the app bundle
        run: codesign --force --sign - "NewShell.app"

      - name: Package zip
        run: |
          set -e
          mkdir -p dist
          # ditto 会保留 .app 的符号链接、权限与 ad-hoc 签名；外层 zip 用纯 ASCII 名
          ditto -c -k --keepParent "NewShell.app" "dist/NewShell-${{ steps.ver.outputs.v }}-macos-arm64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: dist/*.zip

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
